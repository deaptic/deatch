[package]
name = "deatch"
version = "0.3.31"
description = "Deatch"
edition = "2021"

[lib]
# A lib named like the bin collides on Windows (rust-lang/cargo#8519).
name = "deatch_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
twitch_api = { version = "0.8", features = ["helix", "twitch_oauth2", "reqwest", "client", "eventsub", "beta"] }
reqwest = { version = "0.13", features = ["json"] }
url = "2"
keyring-core = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "macros", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
rustls-platform-verifier = "0.7"
futures-util = "0.3"
discord-rich-presence = "1"
interprocess = { version = "2", features = ["tokio"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "=0.0.12"
log = "0.4"
tauri-plugin-log = "2"
http = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
winreg = "0.56"
windows-native-keyring-store = "1"
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
tauri-plugin-single-instance = "2"
widestring = "1"
webview2-com = "0.39"
windows-core = "0.62"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
codegen-units = 1
strip = true
