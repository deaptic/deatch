name: checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          rust-components: rustfmt, clippy

      - name: vp check
        run: vp check --deny-warnings
      - name: vp test
        run: pnpm test
      - name: vite build
        run: pnpm build

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib
