name: setup
description: Install Node, vp, Rust, sccache, caches, and frontend deps

inputs:
  rust-components:
    description: Extra rustup components to install
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: setup vp
      uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        node-version-file: package.json
        cache: true

    - name: setup rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        components: ${{ inputs.rust-components }}

    - name: rust cache
      uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: src-tauri
        cache-on-failure: true
        cache-targets: false

    - name: sccache
      uses: mozilla-actions/sccache-action@9e326ebed976843c9932b3aa0e021c6f50310eb4 # v0.0.6

    - name: compile through sccache
      shell: pwsh
      run: |
        "SCCACHE_GHA_ENABLED=true" >> $env:GITHUB_ENV
        "RUSTC_WRAPPER=sccache" >> $env:GITHUB_ENV
        "CARGO_INCREMENTAL=0" >> $env:GITHUB_ENV
