name: setup
description: Install Deno, Rust, caches, and frontend deps

inputs:
  rust-components:
    description: Extra rustup components to install
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: setup deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: cache deno
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/deno
          ~/.deno
          ~/AppData/Local/deno
        key: ${{ runner.os }}-deno-${{ hashFiles('package.json', 'deno.lock') }}
        restore-keys: ${{ runner.os }}-deno-

    - name: setup rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.rust-components }}

    - name: rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
        cache-on-failure: true
        cache-targets: false

    - name: install frontend deps
      shell: bash
      run: deno install
