name: setup
description: Install Node, pnpm, Rust, caches, and frontend deps

inputs:
  rust-components:
    description: Extra rustup components to install
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: setup vp
      uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        node-version-file: package.json
        cache: true

    - name: setup rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.rust-components }}

    - name: rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
        cache-on-failure: true
        cache-targets: false
